name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # 24.04, not latest: ubuntu-26.04 has no Python 3.9 build.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s tests -t .
      - name: Smoke-test the CLI
        run: python -m repobrief.cli --help > /dev/null

  # The server and runner tests skip without their libraries; this job has both.
  extras:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the MCP and Claude extras
        run: python -m pip install -e ".[mcp,claude]"
      - name: Run tests, including serve and ask
        run: python -m unittest discover -s tests -t .
