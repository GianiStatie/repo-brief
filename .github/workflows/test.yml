name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # 24.04, not latest: ubuntu-26.04 has no Python 3.9 build.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s tests -t .
      - name: Smoke-test the CLI
        run: python -m repobrief.cli --help > /dev/null
