[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-brief"
version = "0.3.0"
description = "Give an agent a map, a ranked context pack, and a staleness check for any repository."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.urls]
Homepage = "https://github.com/GianiStatie/repo-brief"
Repository = "https://github.com/GianiStatie/repo-brief"
Issues = "https://github.com/GianiStatie/repo-brief/issues"

[project.scripts]
repo-brief = "repobrief.cli:main"

[project.optional-dependencies]
# The deterministic CLI needs nothing beyond the standard library. `mcp` is the
# server; each runner of `ask` names its own library.
mcp = ["mcp>=2.3"]
claude = ["claude-agent-sdk>=0.2.180"]

[tool.setuptools]
packages = ["repobrief", "repobrief.adapters", "repobrief.serve", "repobrief.serve.runners"]

[tool.setuptools.package-data]
repobrief = ["skills/*/*.md"]
"repobrief.serve" = ["prompts/*.md"]
